[package]
name = "only-monitor"
version = "0.7.0"
license = "Apache-2.0"
description = "Local Windows system monitor"
edition = "2021"
rust-version = "1.99"

[lib]
name = "only_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-frame = "=1.1.8"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-autostart = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37.2", default-features = false, features = ["system", "disk", "network", "component"] }
ts-rs = "11"
tauri-plugin-notification = "=2.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_System_Com", "Win32_System_IO", "Win32_NetworkManagement_IpHelper"] }
libloading = "0.8"
wmi = { version = "0.18.4", default-features = false }

[patch.crates-io]
auto-launch = { path = "vendor/auto-launch" }
